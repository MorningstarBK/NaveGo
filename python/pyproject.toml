[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynavego"
version = "0.1.0"
description = "Inertial sensor simulation and INS/GNSS/barometric-altitude integration (Python, inspired by NaveGo)"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-only" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pynavego*"]
